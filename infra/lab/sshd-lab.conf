# Shipyard lab SSH policy.
#
# These hosts stand in for Ubuntu VPS targets, so this is deliberately boring:
# keys only, one login user, no root.

AllowUsers deploy
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no

# The lab keypair lives on the Docker host rather than in this image, so it can
# be created, rotated and revoked without rebuilding anything. A real VPS would
# use ~/.ssh/authorized_keys; this is the one deliberate divergence, and it buys
# "no private key is ever baked into an image layer".
AuthorizedKeysCommand /usr/bin/cat /keys/lab_key.pub
AuthorizedKeysCommandUser nobody

# Host key is per-server and lives on a named volume, so each lab host has its
# own identity and known_hosts actually distinguishes them. The Dockerfile
# removes the host keys apt would otherwise bake in at build time.
HostKey /etc/ssh/hostkeys/ssh_host_ed25519_key
