# Lab fleet: three Ubuntu hosts standing in for VPS targets.
#
#   docker compose up -d                      bring up, capture host keys
#   docker compose run --rm keys rotate       replace the lab keypair
#   docker compose run --rm known-hosts check assert the SSH invariants
#   docker compose down -v                    also rotate every host key
#
# The two init containers bracket the fleet: `keys` must finish before any host
# starts (sshd needs the public key to authenticate anyone) and `known-hosts`
# after all hosts are healthy (it captures their identities).

x-server: &server
  image: shipyard-lab
  build:
    context: .
    dockerfile: Dockerfile
  privileged: true
  cgroup: host
  tmpfs: [/run, /run/lock]
  restart: unless-stopped
  networks: [shipyard-lab]
  depends_on:
    keys:
      condition: service_completed_successfully
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "test -s /etc/ssh/hostkeys/ssh_host_ed25519_key.pub && systemctl is-active --quiet ssh.socket",
      ]
    interval: 2s
    timeout: 3s
    retries: 15
    start_period: 5s

x-init: &init
  image: shipyard-lab-init
  build:
    context: .
    dockerfile: Dockerfile.init
  restart: on-failure:3
  volumes: [./keys:/keys]

services:
  keys:
    <<: *init
    container_name: shipyard-keys
    network_mode: none

    command: [keys]

  known-hosts:
    <<: *init
    container_name: shipyard-known-hosts
    # Hosengine cannot use.
    network_mode: host
    command: [known-hosts]
    depends_on:
      shipyard-01:
        condition: service_healthy
      shipyard-02:
        condition: service_healthy
      shipyard-03:
        condition: service_healthy

  shipyard-01:
    <<: *server
    container_name: shipyard-01
    ports: ["2201:22", "8081:80"]
    volumes:
      [
        ./keys:/keys:ro,
        shipyard-01-www:/var/www,
        shipyard-01-log:/var/log/shipyard,
        shipyard-01-ssh:/etc/ssh/hostkeys,
      ]

  shipyard-02:
    <<: *server
    container_name: shipyard-02
    ports: ["2202:22", "8082:80"]
    volumes:
      [
        ./keys:/keys:ro,
        shipyard-02-www:/var/www,
        shipyard-02-log:/var/log/shipyard,
        shipyard-02-ssh:/etc/ssh/hostkeys,
      ]

  shipyard-03:
    <<: *server
    container_name: shipyard-03
    ports: ["2203:22", "8083:80"]
    volumes:
      [
        ./keys:/keys:ro,
        shipyard-03-www:/var/www,
        shipyard-03-log:/var/log/shipyard,
        shipyard-03-ssh:/etc/ssh/hostkeys,
      ]

volumes:
  shipyard-01-www:
  shipyard-01-log:
  shipyard-01-ssh:
  shipyard-02-www:
  shipyard-02-log:
  shipyard-02-ssh:
  shipyard-03-www:
  shipyard-03-log:
  shipyard-03-ssh:

networks:
  shipyard-lab:
    name: shipyard-lab
