# Lab fleet: three Ubuntu hosts standing in for VPS targets.
#
#   make lab-up                                     bring up, capture host keys
#   make lab-check                                  assert the fleet is deployable
#   make lab-rotate-key                             replace the lab keypair
#   make lab-reset                                  tear down, rotating every host key
#
# The two init containers bracket the fleet: `keys` must finish before any host
# starts (sshd needs the public key to authenticate anyone) and `known-hosts`
# after all hosts are healthy (it captures their identities).
#
# Every port is published on 127.0.0.1 only. The fleet is a fixture, not a
# service: nothing outside this machine should be able to reach its sshd, and the
# engine dials the same loopback address a developer would.

x-server: &server
  image: shipyard-lab
  build:
    context: .
    dockerfile: Dockerfile
  privileged: true
  cgroup: host
  tmpfs: [/run, /run/lock]
  restart: unless-stopped
  networks: [shipyard-lab]
  depends_on:
    keys:
      condition: service_completed_successfully
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "test -s /etc/ssh/hostkeys/ssh_host_ed25519_key.pub && systemctl is-active --quiet ssh.socket",
      ]
    interval: 2s
    timeout: 3s
    retries: 15
    start_period: 5s

x-init: &init
  image: shipyard-lab-init
  build:
    context: .
    dockerfile: Dockerfile.init
  restart: on-failure:3
  volumes: [./keys:/keys]

services:
  keys:
    <<: *init
    container_name: shipyard-keys
    network_mode: none

    command: [keys]

  known-hosts:
    <<: *init
    container_name: shipyard-known-hosts
    # Host networking, deliberately. `known_hosts` must be keyed by the address
    # the client will actually dial, and the engine dials the *host's* loopback
    # (127.0.0.1:2201). Only the host network namespace sees that address;
    # scanning shipyard-01:22 over the lab bridge would record a different one and
    # then have to be rewritten into a lie. Same reason `check` runs here: its
    # assertions are end-to-end SSH from the host's point of view.
    network_mode: host
    command: [known-hosts]
    depends_on:
      shipyard-01:
        condition: service_healthy
      shipyard-02:
        condition: service_healthy
      shipyard-03:
        condition: service_healthy

  shipyard-01:
    <<: *server
    container_name: shipyard-01
    hostname: shipyard-01
    ports: ["127.0.0.1:2201:22", "127.0.0.1:8081:80"]
    volumes:
      [
        ./keys:/keys:ro,
        shipyard-01-www:/var/www,
        shipyard-01-log:/var/log/shipyard,
        shipyard-01-ssh:/etc/ssh/hostkeys,
      ]

  shipyard-02:
    <<: *server
    container_name: shipyard-02
    hostname: shipyard-02
    ports: ["127.0.0.1:2202:22", "127.0.0.1:8082:80"]
    volumes:
      [
        ./keys:/keys:ro,
        shipyard-02-www:/var/www,
        shipyard-02-log:/var/log/shipyard,
        shipyard-02-ssh:/etc/ssh/hostkeys,
      ]

  shipyard-03:
    <<: *server
    container_name: shipyard-03
    hostname: shipyard-03
    ports: ["127.0.0.1:2203:22", "127.0.0.1:8083:80"]
    volumes:
      [
        ./keys:/keys:ro,
        shipyard-03-www:/var/www,
        shipyard-03-log:/var/log/shipyard,
        shipyard-03-ssh:/etc/ssh/hostkeys,
      ]

volumes:
  shipyard-01-www:
  shipyard-01-log:
  shipyard-01-ssh:
  shipyard-02-www:
  shipyard-02-log:
  shipyard-02-ssh:
  shipyard-03-www:
  shipyard-03-log:
  shipyard-03-ssh:

networks:
  shipyard-lab:
    name: shipyard-lab
